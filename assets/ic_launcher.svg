<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1C1C24"/>
      <stop offset="1" stop-color="#0A0A0A"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFB75E"/>
      <stop offset="0.55" stop-color="#FF8C1A"/>
      <stop offset="1" stop-color="#E66A00"/>
    </linearGradient>
    <linearGradient id="orangeDeep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F08A1D"/>
      <stop offset="1" stop-color="#C25E00"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#F4A6D6"/>
    </linearGradient>
  </defs>

  <!-- Latar -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="10" y="10" width="492" height="492" rx="103" fill="none" stroke="#FF8C1A" stroke-opacity="0.30" stroke-width="5"/>

  <!-- Kartu di dalam dompet -->
  <rect x="170" y="110" width="172" height="96" rx="18" fill="url(#accent)"/>
  <rect x="170" y="140" width="172" height="16" fill="#0A0A0A" opacity="0.30"/>

  <!-- Badan dompet -->
  <rect x="136" y="204" width="240" height="190" rx="30" fill="url(#orange)"/>

  <!-- Flap atas -->
  <path d="M166 204 h180 a30 30 0 0 1 30 30 v4 h-240 v-4 a30 30 0 0 1 30 -30 z" fill="url(#orangeDeep)"/>

  <!-- Label di sudut kiri atas -->
  <text x="32" y="40" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="bold" fill="#FF8C1A">cerd1x</text>

  <!-- Kancing -->
  <circle cx="318" cy="302" r="24" fill="#0A0A0A"/>
  <circle cx="318" cy="302" r="24" fill="none" stroke="#FF8C1A" stroke-width="7"/>
  <circle cx="318" cy="302" r="7" fill="#FFB75E"/>
</svg>
