name: Android Release APK

on:
  push:
    branches:
      - release
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Create build report
        if: always()
        env:
          BUILD_STATUS: ${{ job.status }}
          APK_PATH: build/app/outputs/flutter-apk/app-release.apk
        run: |
          {
            echo "## Android Release APK"
            echo
            echo "| Output | Value |"
            echo "| --- | --- |"
            echo "| Status | \`${BUILD_STATUS}\` |"
            echo "| Branch | \`${GITHUB_REF_NAME}\` |"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo "| APK path | \`${APK_PATH}\` |"

            if [ -f "$APK_PATH" ]; then
              apk_size="$(du -h "$APK_PATH" | cut -f1)"
              apk_sha256="$(sha256sum "$APK_PATH" | cut -d' ' -f1)"
              echo "| APK size | \`${apk_size}\` |"
              echo "| SHA-256 | \`${apk_sha256}\` |"
            else
              echo "| APK size | Not produced |"
              echo "| SHA-256 | Not available |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          {
            echo "# Android Release APK Build Report"
            echo
            echo "- Status: \`${BUILD_STATUS}\`"
            echo "- Branch: \`${GITHUB_REF_NAME}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- APK path: \`${APK_PATH}\`"

            if [ -f "$APK_PATH" ]; then
              echo "- APK size: \`$(du -h "$APK_PATH" | cut -f1)\`"
              echo "- SHA-256: \`$(sha256sum "$APK_PATH" | cut -d' ' -f1)\`"
            else
              echo "- APK size: Not produced"
              echo "- SHA-256: Not available"
            fi
          } > android-release-build-report.md

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dompetqu-release-apk-${{ github.sha }}
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            android-release-build-report.md
          if-no-files-found: warn
          retention-days: 14
